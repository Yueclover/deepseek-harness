- insert:
    - id: desktop-input
      name: '@deepseek-ai/dsh-desktop-input'
    - id: desktop-input-mimouse-hid
      name: '@deepseek-ai/dsh-desktop-input-mimouse-hid'
      disabled: !!js process.env.DSH_DESKTOP_SCREENSHOT === '0' || process.env.DSH_MIMOUSE_SCREENSHOT === '0'
    - id: desktop-bridge
      name: '@deepseek-ai/dsh-desktop-bridge-child-process'
    - id: screenshot
      name: '@deepseek-ai/dsh-screenshot-desktop'
      disabled: !!js process.env.DSH_DESKTOP_SCREENSHOT === '0'
    - id: screenshot-targets
      name: '@deepseek-ai/dsh-screenshot-target'
      disabled: !!js process.env.DSH_DESKTOP_SCREENSHOT === '0'
    - id: screenshot-target-dsh-agent
      name: '@deepseek-ai/dsh-screenshot-target-dsh-agent'
      disabled: !!js process.env.DSH_DESKTOP_SCREENSHOT === '0'
    - id: screenshot-assistant
      name: '@deepseek-ai/dsh-screenshot-assistant'
      disabled: !!js process.env.DSH_DESKTOP_SCREENSHOT === '0'
      config:
        defaultTargetId: dsh-agent
        inputDeviceId: '*'
        inputControlId: mimouse.screenshot
    - id: screenshot-ui
      name: '@deepseek-ai/dsh-client-ui-screenshot'
      disabled: !!js process.env.DSH_DESKTOP_SCREENSHOT === '0'
